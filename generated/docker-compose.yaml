# Generated by ananke from the 'ananke-demo' topology.
# Source of truth: src/infra.zig
# Do not edit; this file is rewritten by `zig build emit` and every
# byte of it was verified before the binary was allowed to exist.

name: ananke-demo

services:
  # TLS termination and the only thing the internet can reach
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"  # https, https, encrypted
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "https://127.0.0.1:443/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3
    networks: [public, dmz]

  # request routing, auth, rate limiting
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "9100:9100"  # metrics, http
    expose:
      - "8080"  # http
    environment:
      LOG_LEVEL: "info"
      SESSION_SIGNING_SECRET: "${GATEWAY_SESSION_SECRET:?required by ananke}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks: [dmz, internal]

  # stateless; scaled horizontally, so it publishes nothing
  api:
    build: .
    restart: unless-stopped
    expose:
      - "8081"  # http
    environment:
      LOG_LEVEL: "info"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?required by ananke}"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      queue:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3
    deploy:
      replicas: 3
    networks: [internal, restricted]

  # consumes the queue; nothing dials it, so it has no ports
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_started
    deploy:
      replicas: 2
    networks: [internal, restricted]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"  # sql
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required by ananke}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [restricted]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"  # redis
    networks: [restricted]

  queue:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    expose:
      - "5672"  # amqp
    networks: [restricted]


networks:
  public:
    driver: bridge
  dmz:
    driver: bridge
  internal:
    driver: bridge
  restricted:
    driver: bridge
